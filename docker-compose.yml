version: '3.8'

services:
  postgres-driverhub:
    image: postgres:15-alpine
    container_name: postgres-driverhub
    environment:
      POSTGRES_DB: driverhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-driverhub-data:/var/lib/postgresql/data
    networks:
      - driverhub-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d driverhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  driverhub-api:
    build:
      context: ./src
      dockerfile: DriverHub.API/Dockerfile
    container_name: driverhub-api
    ports:
      - "6000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres-driverhub;Database=driverhub;Username=postgres;Password=postgres
    networks:
      - driverhub-net
    depends_on:
      postgres-driverhub:
        condition: service_healthy
    restart: always

  driverhub-frontend:
    build:
      context: ./src/DriverHub.FrontendWeb
      dockerfile: Dockerfile
    container_name: driverhub-frontend
    ports:
      - "6005:80"
    depends_on:
      - driverhub-api
    networks:
      - driverhub-net
    restart: always

networks:
  driverhub-net:
    driver: bridge

volumes:
  postgres-driverhub-data:
