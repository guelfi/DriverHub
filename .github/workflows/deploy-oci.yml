name: CD - Deploy to OCI
on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Digite YES para confirmar o deploy na OCI'
        required: true
        default: ''
  workflow_run:
    workflows: ["CI - Build & Validate"]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-oci-driverhub
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate exact main commit and CI gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$CONFIRM_DEPLOY" == YES ]]
            revision=$GITHUB_SHA
            state=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$revision&per_page=1" --jq '.workflow_runs[0].conclusion')
            [[ "$state" == success ]] || { echo 'CI must pass for this exact main commit'; exit 1; }
          else
            revision=$RUN_SHA
          fi
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.revision }}
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      - name: Add OCI host to known hosts
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy only DriverHub services and validate public routes
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          REVISION: ${{ steps.gate.outputs.revision }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$OCI_USER@$OCI_HOST" "bash -s -- '$REVISION'" < deploy/deploy-oci.sh
